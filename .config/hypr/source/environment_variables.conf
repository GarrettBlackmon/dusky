# HYPRLAND SPECIFIC VARIABLES ARE TO BE SET IN ~/.config/uwsm/env-hyprland
#and compositor indifferent variables in ~/.config/uwsm/env

# this one environment variable is set here to fix a warning caused by hyprland on boot.
env = XDG_CURRENT_DESKTOP,Hyprland

# Multi-GPU Configuration:
# - AMD Radeon Pro W6400 (card0, PCI 0c:00.0): PRIMARY - Display GPU (monitor here)
# - NVIDIA RTX 5090 (card1, PCI 01:00.0): Available for offload + VM passthrough
#
# Force Aquamarine to ONLY use AMD W6400 (prevents NVIDIA device initialization)
# This allows the NVIDIA GPU to be detached for VM passthrough
env = AQ_DRM_DEVICES,/dev/dri/card0

# Renderer selection - Vulkan works best for both AMD and NVIDIA
env = WLR_RENDERER,vulkan
env = WLR_RENDERER_ALLOW_SOFTWARE,0

# Note: AQ_DRM_DEVICES=/dev/dri/card0 above is sufficient to keep Hyprland on AMD
# We don't set VK_ICD_FILENAMES etc here because they would block games from using NVIDIA

# NVIDIA-specific settings (commented out - uncomment only if using NVIDIA as primary)
# env = __EGL_VENDOR_LIBRARY_FILENAMES,/usr/share/glvnd/egl_vendor.d/10_nvidia.json
# env = VK_ICD_FILENAMES,/usr/share/vulkan/icd.d/nvidia_icd.json

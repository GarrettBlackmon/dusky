# PLUGINS CONFIG

# Load hyprexpo plugin (AUR package installs to /usr/lib/libhyprexpo.so)
exec-once = hyprctl plugin load /usr/lib/libhyprexpo.so

#hyprexpo
plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(111111)
        workspace_method = first 1 # [center/first] [workspace] e.g. first 1 or center m+1
        gesture_distance = 300 # how far is the "max" for the gesture
    }

    nstack {
        layout {
            # Ultrawide 32:9 (5120x1440) optimized layout
            # 1 window: Centered at 2560px (50% width)
            # 2+ windows: Master centered with stacks on left/right sides

            orientation = center              # Master horizontally centered
            stacks = 3                        # Total stacks: left, master, right

            # Single window behavior
            center_single_master = 1          # Center single windows
            single_mfact = 0.5                # Single window takes 50% width (2560px)

            # Multi-window behavior
            mfact = 0.5                       # Master takes 50% width (2560px)
            new_is_master = 0                 # New windows go to stacks, not replace master
            new_on_top = 0                    # New windows go to bottom of stack

            # Other settings
            no_gaps_when_only = 0             # Keep gaps even with single window
            special_scale_factor = 0.8
            inherit_fullscreen = 1
        }
    }
}
